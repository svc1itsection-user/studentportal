<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Grade Portal</title>
  <!-- Tailwind CSS for clean UI styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

  <!-- Header -->
  <header class="bg-blue-900 text-white py-6 shadow-md">
    <div class="max-w-5xl mx-auto px-4">
      <h1 class="text-2xl font-bold">Student Portal</h1>
      <p class="text-blue-200 text-sm">Academic Records & Grade Inquiry</p>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4 mt-6">
    
    <!-- Student Login Card -->
    <div id="login-card" class="bg-white p-6 rounded-lg shadow-md max-w-md mx-auto">
      <h2 class="text-xl font-bold mb-4 text-center text-gray-700">Student Login</h2>
      
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Student ID</label>
          <input type="text" id="student-id" placeholder="e.g. L24-01-0198" class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Password</label>
          <input type="password" id="password" placeholder="Enter your password" class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <button onclick="loginStudent()" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2 rounded transition">
          View Grades
        </button>

        <p id="error-msg" class="text-red-500 text-sm text-center hidden"></p>
      </div>
    </div>

    <!-- Student Dashboard (Hidden by default) -->
    <div id="dashboard" class="hidden space-y-6">
      
      <!-- Profile Banner -->
      <div class="bg-white p-6 rounded-lg shadow-md flex justify-between items-center">
        <div>
          <h2 id="student-name" class="text-2xl font-bold text-gray-800"></h2>
          <p id="student-info" class="text-gray-600"></p>
        </div>
        <button onclick="logout()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded text-sm font-semibold transition">
          Log Out
        </button>
      </div>

      <!-- Subject Cards Grid -->
      <div id="records-container" class="space-y-6"></div>

    </div>

  </main>

  <script>
    // Embedded Credentials
    const SUPABASE_URL = 'https://etizsatbjfsubdpsxjza.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_7ThT_6Up1Rya208GcGAEbg_Y_GNTi1N';

    // Initialized client without variable shadowing conflict
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loginStudent() {
      const studentId = document.getElementById('student-id').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('error-msg');

      errorMsg.classList.add('hidden');

      if (!studentId || !password) {
        errorMsg.textContent = 'Please enter both Student ID and Password.';
        errorMsg.classList.remove('hidden');
        return;
      }

      // Query Supabase for matching records
      const { data, error } = await supabaseClient
        .from('portal_records')
        .select('*')
        .eq('student_id', studentId)
        .eq('password', password);

      if (error) {
        console.error('Supabase Query Error:', error);
        errorMsg.textContent = 'Database error. Please try again later.';
        errorMsg.classList.remove('hidden');
        return;
      }

      if (!data || data.length === 0) {
        errorMsg.textContent = 'Invalid Student ID or Password.';
        errorMsg.classList.remove('hidden');
        return;
      }

      // Hide login form and reveal dashboard
      document.getElementById('login-card').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');

      renderDashboard(data);
    }

    function renderDashboard(records) {
      // Set student profile info from the first matching record
      const student = records[0];
      document.getElementById('student-name').textContent = student.name || 'Student';
      document.getElementById('student-info').textContent = `ID: ${student.student_id} | Course: ${student.course || 'N/A'}`;

      const container = document.getElementById('records-container');
      container.innerHTML = '';

      // Render a details card for every subject/term entry
      records.forEach(rec => {
        const card = document.createElement('div');
        card.className = 'bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-600';

        card.innerHTML = `
          <div class="flex justify-between items-center mb-4 border-b pb-2">
            <div>
              <h3 class="text-xl font-bold text-gray-800">${rec.subject || 'Subject'} (${rec.term || 'Term'})</h3>
              <p class="text-xs text-gray-500">School Year: ${rec.school_year || '-'} | Semester: ${rec.semester || '-'}</p>
            </div>
            <div class="text-right">
              <span class="text-sm font-medium text-gray-500 block">Final Grade</span>
              <p class="text-2xl font-bold text-blue-700">${rec.grade || 'N/A'}</p>
            </div>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-3 text-center bg-gray-50 p-4 rounded text-sm">
            <div class="bg-white p-2 rounded border"><span class="text-xs text-gray-500 block">Quiz 1</span><strong>${rec.quiz1 || '-'}</strong></div>
            <div class="bg-white p-2 rounded border"><span class="text-xs text-gray-500 block">Quiz 2</span><strong>${rec.quiz2 || '-'}</strong></div>
            <div class="bg-white p-2 rounded border"><span class="text-xs text-gray-500 block">Quiz 3</span><strong>${rec.quiz3 || '-'}</strong></div>
            <div class="bg-white p-2 rounded border"><span class="text-xs text-gray-500 block">Quiz 4</span><strong>${rec.quiz4 || '-'}</strong></div>
            <div class="bg-white p-2 rounded border"><span class="text-xs text-gray-500 block">Quiz 5</span><strong>${rec.quiz5 || '-'}</strong></div>
            <div class="bg-white p-2 rounded border"><span class="text-xs text-gray-500 block">Quiz 6</span><strong>${rec.quiz6 || '-'}</strong></div>
            <div class="bg-white p-2 rounded border"><span class="text-xs text-gray-500 block">Quiz 7</span><strong>${rec.quiz7 || '-'}</strong></div>
            <div class="bg-white p-2 rounded border"><span class="text-xs text-gray-500 block">Quiz 8</span><strong>${rec.quiz8 || '-'}</strong></div>
            <div class="bg-white p-2 rounded border"><span class="text-xs text-gray-500 block">Exam</span><strong>${rec.exam || '-'}</strong></div>
            <div class="bg-white p-2 rounded border"><span class="text-xs text-gray-500 block">Quiz Avg</span><strong>${rec.quiz_avg || '-'}</strong></div>
            <div class="bg-white p-2 rounded border"><span class="text-xs text-gray-500 block">Exam Avg</span><strong>${rec.exam_avg || '-'}</strong></div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function logout() {
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('login-card').classList.remove('hidden');
      document.getElementById('student-id').value = '';
      document.getElementById('password').value = '';
    }
  </script>
</body>
</html>
